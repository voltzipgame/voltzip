<!-- ============ CORE: pure game logic (no DOM). The headless test runs this exact code. ============ -->
<script id="core">
const H=400,GROUND=320,PW=30,DT=1/120,START_X=60,CELL=256;
const G=2300,JUMP=700,JUMP2=620,HOLD_MAX=0.2,HOLD_G=0.5,CUT=520,COYOTE=0.08,BUFFER=0.12;
const MIN_HOLD=0.07,TAP=0.08,FULL=0.3,TOP=GROUND-2200;
const STAR3=0.9,STAR2=0.5,PICK_R=26;

function diff(n){return Math.min(1,Math.pow(Math.max(0,n-1)/99,0.85));}
function speedFor(n){return 270+200*diff(n);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function starsFor(got,total){const f=total?got/total:1;return f>=STAR3-1e-9?3:f>=STAR2-1e-9?2:1;}

function newPlayer(){return{x:START_X,y:GROUND-PW,vy:0,ground:true,jumps:0,coy:COYOTE,buf:0,holdT:0,dead:false,won:false,lastGround:GROUND,t:0,got:null,coins:0,ev:null};}
function kill(p){p.dead=true;if(p.ev)p.ev.push('die');}
function groundJump(p){p.vy=-JUMP;p.jumps=1;p.ground=false;p.coy=0;p.holdT=0;p.buf=0;if(p.ev)p.ev.push('jump');}
function doJump(p){
  if(p.ground||(p.coy>0&&p.jumps===0))groundJump(p);
  else if(p.jumps<2){p.vy=-JUMP2;p.jumps=2;p.holdT=0;p.buf=0;if(p.ev)p.ev.push('jump2');}
  else p.buf=BUFFER;
}
function pendPos(o,t){const a=o.amp*Math.sin(t*2*Math.PI/o.per+o.ph);return[o.ax+o.len*Math.sin(a),o.ay+o.len*Math.cos(a)];}

// One fixed 1/120 s physics step. held = button is down this step, pressed = a new press happened.
function step(L,p,held,pressed){
  if(p.dead)return;
  p.t+=DT;
  if(p.buf>0)p.buf-=DT;
  if(pressed)doJump(p);
  const py=p.y;
  p.x+=L.speedAt(p.x)*DT;
  let g=G;
  // MIN_HOLD: every jump keeps the boost for at least 0.07 s, so any quick tap (10–70 ms)
  // flies the identical arc. This is what makes coin arcs line up with real taps.
  if((held||p.holdT<MIN_HOLD)&&p.vy<0&&p.holdT<HOLD_MAX){g*=HOLD_G;p.holdT+=DT;}
  else if(!held&&p.vy<-CUT)p.vy=-CUT;
  p.vy+=g*DT;p.y+=p.vy*DT;
  const was=p.ground;p.ground=false;
  const x0=p.x,x1=p.x+PW,c0=(x0/CELL)|0,c1=(x1/CELL)|0;
  for(let c=c0;c<=c1;c++){
    const arr=L.grid[c];if(!arr)continue;
    for(let i=0;i<arr.length;i++){
      const o=arr[i];
      if(o.x>=x1||o.x+o.w<=x0)continue;
      if(o.t===0){
        if(p.y>=o.y+o.h||p.y+PW<=o.y)continue;
        if(py+PW<=o.y+2&&p.vy>=0){p.y=o.y-PW;p.vy=0;p.ground=true;}
        else if(py>=o.y+o.h-2&&p.vy<0){p.y=o.y+o.h;p.vy=0;}
        else{kill(p);return;}
      }else if(o.t===1){
        if(x1>o.x+6&&x0<o.x+24&&p.y+PW>o.y-22&&p.y<o.y){kill(p);return;}
      }else if(o.t===2){
        const b=pendPos(o,p.t);
        const qx=Math.max(x0+3,Math.min(b[0],x1-3)),qy=Math.max(p.y+3,Math.min(b[1],p.y+PW-3));
        if((b[0]-qx)*(b[0]-qx)+(b[1]-qy)*(b[1]-qy)<o.r*o.r){kill(p);return;}
      }else if(o.t===3){
        if(p.got&&!p.got[o.i]){
          const dx=o.cx-(p.x+15),dy=o.cy-(p.y+15);
          if(dx*dx+dy*dy<PICK_R*PICK_R){p.got[o.i]=1;p.coins++;if(p.ev)p.ev.push('coin',o.i);}
        }
      }
    }
  }
  if(p.ground){
    if(!was&&p.ev)p.ev.push('land');
    p.jumps=0;p.coy=COYOTE;p.lastGround=p.y+PW;p.holdT=0;
    if(p.buf>0)groundJump(p);
  }else p.coy-=DT;
  if(p.y>Math.min(520,p.lastGround+380)){kill(p);return;}
  if(!p.won&&p.x>L.end){p.won=true;if(p.ev)p.ev.push('win');}
}

// ---------------- Difficulty curve ----------------
// Level length target in seconds (interpolated): 1→30 s, 10→40 s, 11→55 s, 30→65 s, 60→80 s, 100→90 s, 150+→100 s.
const LEN_PTS=[[1,30],[10,40],[11,55],[30,65],[60,80],[100,90],[150,100]];
function targetSecs(n){
  if(n<=1)return LEN_PTS[0][1];
  for(let i=1;i<LEN_PTS.length;i++){const a=LEN_PTS[i-1],b=LEN_PTS[i];if(n<=b[0])return a[1]+(b[1]-a[1])*(n-a[0])/(b[0]-a[0]);}
  return LEN_PTS[LEN_PTS.length-1][1];
}
// Required timing window (full width, ms) for every jump: the takeoff can be this early/late
// (centred) and the jump still works. Longer levels need forgiving jumps, otherwise a long
// level becomes a coin-flip. Tuned with analiz.js (human model σ = 30 ms).
// Curve points (difficulty d → window ms), calibrated against a σ = 50 ms casual-player model.
let WIN_PTS=[[0,200],[.04,175],[.13,138],[.2,140],[.33,135],[.64,138],[.8,148],[1,160]],WIN_SCALE=1;
function windowMs(d){
  for(let i=1;i<WIN_PTS.length;i++){const a=WIN_PTS[i-1],b=WIN_PTS[i];if(d<=b[0])return WIN_SCALE*(a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0]));}
  return WIN_SCALE*WIN_PTS[WIN_PTS.length-1][1];
}
function nForD(d){return 1+99*Math.pow(Math.max(0,d),1/0.85);}

// ---------------- Level generator ----------------
// Every obstacle is "planned": the generator simulates the real step() over a range of takeoff
// points with human-style inputs (taps of 40–140 ms, or a full hold), finds the contiguous range
// of takeoffs that survive, and accepts the obstacle only if that range is at least windowMs wide.
// The intended takeoff is the centre of the range; coins are placed on that exact arc.
function makeLevel(seed,cfg){
  const R=mulberry32(seed);
  const L={n:cfg.n,endless:!!cfg.endless,objs:[],coins:[],plans:[],grid:[],zones:[],end:Infinity,endY:GROUND,hue:cfg.hue};
  L.speedAt=x=>{const z=L.zones;for(let i=z.length-1;i>0;i--)if(x>=z[i].x)return z[i].speed;return z[0].speed;};
  L.timeAt=x=>{const z=L.zones;let i=z.length-1;while(i>0&&x<z[i].x)i--;return z[i].t+(x-z[i].x)/z[i].speed;};
  const addZone=(x,speed)=>{const t=L.zones.length?L.timeAt(x):0;L.zones.push({x,speed,t});};
  const rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
  const S={x:0,h:GROUND,minT:0};
  // difficulty context (constant for a level; updated per stage in endless mode)
  const C={n:1,d:0,speed:270,easy:true,win:60};
  function setCtx(n){C.n=n;C.d=diff(n);C.speed=speedFor(n);C.easy=n<=2;C.win=windowMs(C.d)/1000*C.speed;}

  function add(o){
    o.id=L.objs.length;L.objs.push(o);
    const a=Math.max(0,(o.x/CELL)|0),b=((o.x+o.w)/CELL)|0;
    for(let c=a;c<=b;c++)(L.grid[c]||(L.grid[c]=[])).push(o);
    return o;
  }
  const blk=(x,y,w,h,plat)=>add({t:0,x,y,w,h,plat:!!plat});
  const gnd=(x0,x1,y)=>blk(x0,y,x1-x0,450-y,false);
  const spike=(x,y)=>add({t:1,x,y,w:30});
  const coin=(cx,cy)=>{const i=L.coins.length;L.coins.push({cx,cy});add({t:3,i,cx,cy,x:cx-28,w:56});};

  function sim(x0,surf,o){
    const p=newPlayer();p.x=x0;p.y=surf-PW;p.t=L.timeAt(x0);p.lastGround=surf;
    const hs=o.none?0:Math.round(o.h/DT),ds=o.dj?Math.round(o.dj.t/DT):-1,dh=o.dj?Math.round(o.dj.h/DT):0;
    const path=[];let air=-1;
    for(let k=0;k<700;k++){
      const pressed=!o.none&&(k===0||k===ds);
      const held=!o.none&&(k<hs||(ds>=0&&k>=ds&&k<ds+dh));
      step(L,p,held,pressed);
      if(p.dead)return null;
      path.push(p.x+15,p.y+15);
      if(!p.ground){if(air<0)air=k;}
      else if(air>=0)return{landX:p.x,landY:p.y+PW,path,air};
    }
    return null;
  }
  // Find the widest contiguous range of takeoff x for option o that survives with all its
  // input variants (tap 40/80/140 ms; double-jump timing ±50 ms). Returns {x0,width,r} or null.
  function window(obsX,surf,o,ok){
    const variants=o.h===TAP?[{h:TAP},{h:.04},{h:.14}]:[{h:FULL}];
    if(o.dj)for(const v of variants.slice()){v.dj=o.dj;}
    const djv=o.dj?[{h:o.h,dj:{t:o.dj.t-.05,h:o.dj.h}},{h:o.h,dj:{t:o.dj.t+.05,h:o.dj.h}}]:[];
    const all=variants.map(v=>({h:v.h,dj:o.dj||null})).concat(djv);
    const good=x0=>{if(x0<S.minT)return false;for(const v of all)if(!ok(sim(x0,surf,v)))return false;return true;};
    const STEP=6,MAXL=300;
    let best=null,run0=null;
    for(let lead=MAXL;lead>=-10;lead-=STEP){ // x0 increasing
      const x0=obsX-PW-lead,g=good(x0);
      if(g&&run0===null)run0=x0;
      if((!g||lead-STEP< -10)&&run0!==null){
        const end=g?x0:x0-STEP,w=end-run0;
        if(!best||w>best.width)best={a:run0,b:end,width:w};
        run0=null;
      }
    }
    if(!best)return null;
    const x0=(best.a+best.b)/2;
    return{x0,width:best.width,r:sim(x0,surf,{h:o.h,dj:o.dj||null})};
  }
  function plan(obsX,surf,tgt,minLand,allowDJ){
    const ok=r=>r&&Math.abs(r.landY-tgt)<.5&&r.landX>=minLand;
    const opts=[{h:TAP},{h:FULL}];
    if(allowDJ)for(const t of [.22,.3])for(const h2 of [TAP,FULL])opts.push({h:FULL,dj:{t,h:h2}});
    for(const o of opts){
      const w=window(obsX,surf,o,ok);
      if(w&&w.width>=C.win){
        const r=w.r;
        if(o.h===TAP){r.alts=[sim(w.x0,surf,{h:.04,dj:o.dj||null}),sim(w.x0,surf,{h:.14,dj:o.dj||null})].filter(Boolean);}
        return{x0:w.x0,o,r,width:w.width};
      }
      if(o.dj&&!allowDJ)break;
    }
    return null;
  }
  // Coins sit on the planned arc at spots that the short and long tap variants also pass through.
  function arcCoins(r){
    const N=r.path.length/2-r.air,alts=r.alts||[],SAFE=(PICK_R-5)*(PICK_R-5);
    const okAt=i=>{const x=r.path[2*i],y=r.path[2*i+1];
      for(const a of alts){let m=1e9;for(let j=0;j<a.path.length;j+=2){const dx=a.path[j]-x,dy=a.path[j+1]-y;const q=dx*dx+dy*dy;if(q<m)m=q;}if(m>SAFE)return false;}return true;};
    let lastI=-99;
    for(const f of [.15,.4,.65,.9]){
      const i0=r.air+Math.floor(f*N);let pick=-1;
      for(let dd=0;dd<=Math.ceil(N*.2)&&pick<0;dd++){for(const i of [i0-dd,i0+dd]){if(i>r.air&&i<r.air+N&&i-lastI>=4&&okAt(i)){pick=i;break;}}}
      if(pick>=0){coin(r.path[2*pick],r.path[2*pick+1]);lastI=pick;}
    }
  }
  function commit(pl){L.plans.push({x0:pl.x0,h:pl.o.h,dj:pl.o.dj||null,w:pl.width});arcCoins(pl.r);S.minT=pl.r.landX+10;}
  // rest after landing: a little breathing room, more on easy/long levels
  function finish(land){
    S.h=land.y;
    S.x=Math.max(S.minT+C.speed*(C.easy?rnd(.35,.6):rnd(.12,.4)*(1-.35*C.d)),land.x+40);
    land.w=S.x-land.x;
  }
  const pre=()=>C.easy?rnd(80,160):rnd(40,110);

  function pFlat(w){
    gnd(S.x,S.x+w,S.h);
    if(w>=160&&R()<.6){const m=S.x+w/2;for(const k of [-35,0,35])coin(m+k,S.h-20);S.minT=Math.max(S.minT,m+40);}
    S.x+=w;return true;
  }
  function pGap(w,dh){
    const ox=S.x+pre();gnd(S.x,ox,S.h);
    const h2=Math.min(GROUND,S.h+dh);
    const land=gnd(ox+w,ox+w+900,h2);
    const pl=plan(ox,S.h,h2,ox+w-PW+4,C.d>.45);if(!pl)return false;
    commit(pl);finish(land);return true;
  }
  function pSpike(k,preLen){
    const ox=S.x+(preLen!=null?preLen:pre());const b=gnd(S.x,ox+30*k+900,S.h);
    for(let i=0;i<k;i++)spike(ox+i*30,S.h);
    const pl=plan(ox,S.h,S.h,ox+30*k-6,C.d>.6);if(!pl)return false;
    commit(pl);finish(b);return true;
  }
  function pStep(r,preLen){
    const top=S.h-r;if(top<TOP)return false;
    const ox=S.x+(preLen!=null?preLen:pre());gnd(S.x,ox,S.h);
    const land=gnd(ox,ox+900,top);
    const pl=plan(ox,S.h,top,ox-PW+2,C.d>.5);if(!pl)return false;
    commit(pl);finish(land);return true;
  }
  function pDrop(r){
    r=Math.min(r,GROUND-S.h);if(r<15)return false;
    const ox=S.x+rnd(40,120);gnd(S.x,ox,S.h);
    const land=gnd(ox,ox+900,S.h+r);
    const x0=Math.max(S.minT,ox-PW-40);
    const res=sim(x0,S.h,{none:true});if(!res)return false;
    arcCoins(res);S.minT=res.landX+10;finish(land);return true;
  }
  function pFloat(k,rising,e){e=e||1;
    let obs=S.x+pre();gnd(S.x,obs,S.h);let surf=S.h,y=S.h;
    for(let i=0;i<k;i++){
      const g=rnd(50,60+C.speed*(.1+.3*C.d))*e,pw=Math.max(110,(rnd(170,260)-110*C.d)/Math.max(1,e));
      y=rising?y-rnd(30,50+25*C.d):Math.min(GROUND-10,y+rnd(-45,35));
      if(y<TOP)return false;
      const px=obs+g;blk(px,y,pw,22,true);
      const pl=plan(obs,surf,y,px-PW+4,C.d>.3);if(!pl)return false;
      commit(pl);surf=y;obs=px+pw;
    }
    const g=rnd(50,90),h2=Math.min(GROUND,surf+rnd(0,40));
    const land=gnd(obs+g,obs+g+900,h2);
    const pl=plan(obs,surf,h2,obs+g-PW+4,true);if(!pl)return false;
    commit(pl);finish(land);return true;
  }
  // Pendulum: a spiked ball swinging over the path. Its lowest point leaves 14 px above the
  // runner's head, so running under it is always safe; only a jump into it kills.
  function pSwing(withSpikes){
    const len=rnd(85,130),amp=rnd(.55,.95),per=rnd(1.3,1.9)*(1-.3*C.d),r=15;
    const reach=len*Math.sin(amp)+r;
    const ax=S.x+reach+rnd(40,70),ay=S.h-PW-14-r-len,zoneEnd=ax+reach;
    const b=gnd(S.x,zoneEnd+900,S.h);
    add({t:2,ax,ay,len,amp,per,ph:R()*6.2832,r,x:ax-reach,w:2*reach});
    if(withSpikes){
      const k=R()<.6?1:2,sx=ax-15*k;
      for(let i=0;i<k;i++)spike(sx+i*30,S.h);
      const pl=plan(sx,S.h,S.h,sx+30*k-6,C.d>.5);if(!pl)return false;
      commit(pl);
    }else{for(const k of [-40,0,40])coin(ax+k,S.h-20);}
    S.minT=Math.max(S.minT,zoneEnd+10);
    finish(b);return true;
  }

  function attempt(fn){
    const no=L.objs.length,nc=L.coins.length,np=L.plans.length,s={x:S.x,h:S.h,minT:S.minT};
    if(fn())return true;
    for(let j=L.objs.length-1;j>=no;j--){
      const o=L.objs[j],a=Math.max(0,(o.x/CELL)|0),b=((o.x+o.w)/CELL)|0;
      for(let c=a;c<=b+4;c++){const arr=L.grid[c];if(!arr)continue;const k=arr.lastIndexOf(o);if(k>=0)arr.splice(k,1);}
    }
    L.objs.length=no;L.coins.length=nc;L.plans.length=np;S.x=s.x;S.h=s.h;S.minT=s.minT;return false;
  }
  function pick(ws){let tot=0;for(const k in ws)tot+=ws[k];let r=R()*tot;for(const k in ws){r-=ws[k];if(r<=0)return k;}return 'flat';}

  // e = obstacle size factor. Tried from hardest to easiest; the first variant whose takeoff
  // window is still >= the required width wins, so the window setting directly sets difficulty.
  function build(kind,e){
    const elev=GROUND-S.h,d=C.d,n=C.n,speed=C.speed;
    switch(kind){
      case 'flat':return pFlat(rnd(120,260));
      case 'gap':{
        if(C.easy){const dh=elev>0&&R()<.5?rnd(20,Math.min(60,elev)):0;return pGap(rnd(35,85)*e,dh);}
        const w=(60+R()*speed*(.15+.45*d))*e;
        const dh=R()<.45?rnd(20,90):R()<.25?-rnd(10,35+30*d)*e:0;
        return pGap(w,dh);
      }
      case 'spike':return pSpike(Math.max(1,Math.min(6,Math.round((1+R()*(1+2*d))*e))));
      case 'step':
        if(C.easy)return (elev>0&&R()<.65)?pDrop(rnd(25,Math.max(30,elev))):pStep(rnd(25,40)*e);
        return pStep((30+R()*(25+45*d))*e);
      case 'drop':return pDrop(rnd(80,180));
      case 'stairs':{
        const k=ri(2,4);
        for(let i=0;i<k&&GROUND-S.h>=30;i++){
          const ok=R()<.5?pDrop(rnd(40,90)):pGap(rnd(50,70+speed*.25*d)*e,Math.min(GROUND-S.h,rnd(40,90)));
          if(!ok)return false;
        }
        return true;
      }
      case 'swing':return pSwing(n>=8&&R()<.5&&e>=1);
      case 'climb':{
        const k=Math.min(9,ri(3,3+Math.floor(6*d)));
        for(let i=0;i<k;i++){
          if(n>=40&&R()<.5*d){if(!pSpike(1,rnd(60,110)))return false;}
          if(!pStep((30+R()*(15+30*d))*e,rnd(60,120)))return false;
        }
        return true;
      }
      case 'float':return pFloat(Math.max(2,Math.round(ri(2,2+Math.round(3*d))*e)),false,e);
      case 'spikeStep':return pStep((30+R()*(20+30*d))*e)&&pSpike(ri(1,2),rnd(60,110));
      case 'tower':return pFloat(Math.max(2,Math.round(ri(3,5)*e)),true,e);
    }
    return false;
  }
  let climbs=0,lastClimbX=-1e9;
  function nextPattern(){
    const elev=GROUND-S.h,d=C.d,n=C.n;let kind;
    if(C.easy){
      kind=pick({gap:.45,step:.33,flat:.22});
      if(elev>=70&&R()<.7)kind='step';
    }else kind=pick({
      gap:5+2*d, spike:2+2*d,
      step:n>=2&&elev<900?1:0,
      drop:elev>=40?1.5+elev/120:0,
      stairs:elev>=120?1+elev/150:0,
      swing:n>=3?1.4+.6*d:0,
      climb:n>=4&&elev<1200&&S.x-lastClimbX>C.speed*20?.5:0,
      float:n>=6?1+1.5*d:0,
      spikeStep:n>=20?1+d:0,
      tower:n>=35&&elev<1400?.6+d:0,
      flat:.6-.4*d
    });
    let ok=false;
    for(const e of (C.easy?[1.3,1,.82,.67]:[3.5,2.9,2.4,2,1.65,1.35,1.1,.9,.7]))if(!ok)ok=attempt(()=>build(kind,e));
    if(ok&&kind==='climb'){climbs++;lastClimbX=S.x;}
    if(!ok)attempt(()=>pFlat(rnd(80,200)));
  }

  // start: flat runway
  setCtx(cfg.n||1);
  addZone(START_X,C.speed);
  gnd(0,600,GROUND);S.x=600;S.minT=400;
  if(!cfg.endless){
    const lenPx=targetSecs(cfg.n)*C.speed;
    while(S.x<lenPx)nextPattern();
    gnd(S.x,S.x+300,S.h);L.end=S.x+300;L.endY=S.h;gnd(L.end,L.end+1000,S.h);
  }else{
    // Endless: difficulty rises every stage (~STAGE px). Each stage starts with a short flat
    // "speed gate" where the new speed takes effect, so no jump ever spans a speed change.
    const STAGE=2200;let stage=0,stageEnd=STAGE;
    const dOf=s=>Math.min(1,cfg.d0+s*cfg.dStep);
    setCtx(nForD(dOf(0)));L.zones[0].speed=C.speed;
    L.extend=upto=>{
      let guard=0;
      while(S.x<upto&&guard++<60){
        if(S.x>=stageEnd){
          stage++;stageEnd=S.x+STAGE;
          setCtx(nForD(dOf(stage)));
          gnd(S.x,S.x+160,S.h);S.minT=Math.max(S.minT,S.x+20);
          addZone(S.x+40,C.speed);S.x+=160;
          L.stage=stage;
        }
        nextPattern();
      }
    };
    L.stage=0;L.extend(4000);
  }
  return L;
}
function genLevel(n){return makeLevel(n*9973+7,{n,hue:(n*47+250)%360});}
function genEndless(seed){return makeLevel(seed*7919+13,{endless:true,n:1,d0:.0,dStep:.035,hue:200});}
function setWindow(pts){WIN_PTS=pts;}
var ZZ={H,GROUND,PW,DT,START_X,TAP,FULL,STAR3,STAR2,diff,speedFor,genLevel,genEndless,targetSecs,windowMs,setWindow,newPlayer,step,pendPos,starsFor};
</script>

<!-- ============ Rendering, UI, audio ============ -->
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let dpr=1,cW=0,cH=0,scale=1,offY=0,viewW=480;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cW=innerWidth;cH=innerHeight;cv.width=Math.round(cW*dpr);cv.height=Math.round(cH*dpr);scale=Math.min(cH/H,cW/480);offY=cH-H*scale;viewW=cW/scale;}
addEventListener('resize',resize);resize();

// ---------- storage ----------
function load(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let level=load('zipzip_level',1),bestStars=load('zipzip_stars',{}),wallet=load('zipzip_wallet',0),owned=load('zipzip_owned',['nane']),skinId=load('zipzip_skin','nane');
const totalStars=()=>Object.values(bestStars).reduce((a,b)=>a+b,0);

// ---------- skins ----------
const SKINS=[
 {id:'nane',name:'Nane',price:0,shape:'box',color:'#3ee0a8',trail:'#a8ffe0'},
 {id:'cilek',name:'Çilek',price:25,shape:'box',color:'#ff4d6d',trail:'#ffb3c1'},
 {id:'limon',name:'Limon',price:40,shape:'ball',color:'#ffe14d',trail:'#fff3a8'},
 {id:'kovboy',name:'Kovboy',price:70,shape:'box',color:'#d9a066',trail:'#f2d1a8',extra:'hat'},
 {id:'havali',name:'Havalı',price:110,shape:'box',color:'#5ab4ff',trail:'#b8e0ff',extra:'glasses'},
 {id:'gece',name:'Gece',price:150,shape:'ball',color:'#2b2d6e',trail:'#8f93ff',extra:'stars'},
 {id:'hayalet',name:'Hayalet',price:200,shape:'ghost',color:'#e8ecff',trail:'#ffffff',alpha:.85},
 {id:'kral',name:'Kral',price:300,shape:'box',color:'#9b5cff',trail:'#d7b8ff',extra:'crown'},
 {id:'gokkusagi',name:'Gökkuşağı',price:0,needStars:30,shape:'ball',color:'rainbow',trail:'rainbow'}];
const skin=()=>SKINS.find(s=>s.id===skinId)||SKINS[0];
const isOwned=s=>s.needStars?totalStars()>=s.needStars:owned.includes(s.id);
const skinCol=(s,t)=>s.color==='rainbow'?`hsl(${(t*140)%360},90%,62%)`:s.color;
const trailCol=(s,t)=>s.trail==='rainbow'?`hsl(${(t*140+40)%360},90%,70%)`:s.trail;

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
// origin = feet center; units = world px
function drawChar(c,s,t,vy,sq){
  const sx=1+(1-sq)*.9,sy=sq;
  c.save();c.scale(sx,sy);c.globalAlpha*=s.alpha||1;
  c.fillStyle=skinCol(s,t);
  if(s.shape==='box'){
    rr(c,-15,-30,30,30,6);c.fill();
    c.save();rr(c,-15,-30,30,30,6);c.clip();c.fillStyle='rgba(0,0,0,.22)';c.fillRect(-15,-7,30,7);c.restore();
  }else if(s.shape==='ball'){
    c.beginPath();c.arc(0,-15,15,0,Math.PI*2);c.fill();
  }else{
    c.beginPath();c.moveTo(-15,-15);c.arc(0,-15,15,Math.PI,0);c.lineTo(15,-1);
    for(let i=1;i<=6;i++){c.lineTo(15-i*5,-1+(i%2?-4:1)+Math.sin(t*9+i)*1.5);}
    c.closePath();c.fill();
  }
  if(s.extra==='stars'){c.fillStyle='#fff';for(const [x,y] of [[-8,-25],[7,-8],[-4,-6],[10,-24],[0,-28]]){c.fillRect(x,y,2,2);}}
  const py=Math.max(-3,Math.min(3,vy/150));
  c.fillStyle='#fff';c.beginPath();c.arc(-6,-18,5,0,7);c.arc(6,-18,5,0,7);c.fill();
  c.fillStyle='#1b1533';c.beginPath();c.arc(-4.5,-18+py,2.4,0,7);c.arc(7.5,-18+py,2.4,0,7);c.fill();
  if(s.extra==='glasses'){c.fillStyle='#111';rr(c,-13,-23,11,8,2);c.fill();rr(c,1,-23,11,8,2);c.fill();c.fillRect(-2,-21,3,2);}
  if(s.extra==='hat'){c.fillStyle='#6b3e1d';c.beginPath();c.ellipse(0,-30,21,4,0,0,7);c.fill();rr(c,-10,-42,20,13,4);c.fill();c.fillStyle='#e3c08a';c.fillRect(-10,-33,20,3);}
  if(s.extra==='crown'){c.fillStyle='#ffd23f';c.beginPath();c.moveTo(-12,-30);c.lineTo(-12,-40);c.lineTo(-6,-34);c.lineTo(0,-43);c.lineTo(6,-34);c.lineTo(12,-40);c.lineTo(12,-30);c.closePath();c.fill();c.fillStyle='#ff4d6d';c.beginPath();c.arc(0,-35,2,0,7);c.fill();}
  c.restore();
}

// ---------- audio / haptics ----------
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);}catch(e){}}
const zap=()=>tone(2200,500,.05,'sawtooth',.02);
const sfx={jump:()=>{tone(300,620,.12,'square',.06);zap();},jump2:()=>{tone(450,900,.12,'square',.06);zap();},coin:()=>tone(900,1400,.09,'triangle',.09),die:()=>tone(220,50,.35,'sawtooth',.09),win:()=>{tone(660,990,.12,'square',.07);tone(990,1320,.18,'square',.07,.13);}};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

// ---------- game state ----------
let bolts=[];let mode='level',bestScore=load('zipzip_best',0),run={},lastStage=0,toastT=0;let state='menu',L=null,P=null,curN=1,attempts=1,camX=0,camY=0,shake=0,parts=[],deadT=0,winT=0,sq=1,acc=0,time=0,last=0,countdown=0;
let held=false,presses=0;const ptrs=new Set();

function show(id){for(const o of ['menu','win','map','shop','over'])$(o).classList.toggle('on',o===id);$('hud').classList.toggle('on',id==='hud');$('attempt').style.display=id==='hud'&&attempts>1?'block':'none';}
function startLevel(n){mode='level';curN=n;L=ZZ.genLevel(n);attempts=1;resetRun();state='play';show('hud');$('bar').style.display='';$('hudLv').textContent='Seviye '+n;}
// Endless run: road is generated ahead of the player while running; speed rises every stage.
function startEndless(){mode='endless';L=ZZ.genEndless((Math.random()*1e9)|0);attempts=1;resetRun();state='play';show('hud');$('bar').style.display='none';
  run={combo:0,mult:1,coinPts:0,missIdx:0,meters:0,score:0,spd:0};}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');toastT=1.3;}
function endlessScore(){
  run.meters=Math.max(0,Math.floor((P.x-ZZ.START_X)/10));
  while(run.missIdx<L.coins.length&&L.coins[run.missIdx].cx<P.x-20){if(!P.got[run.missIdx]){if(run.combo>=8)toast('Kombo bitti');run.combo=0;run.mult=1;}run.missIdx++;}
  run.score=run.meters+run.coinPts;
}
function showOver(){
  endlessScore();state='over';const coins=P.coins;wallet+=coins;save('zipzip_wallet',wallet);
  const rec=run.score>bestScore;if(rec){bestScore=run.score;save('zipzip_best',bestScore);}
  $('overTitle').textContent=rec?'Yeni rekor! 🏆':'Koşu bitti!';
  $('overScore').textContent=run.score.toLocaleString('tr-TR');
  $('overBest').textContent='Rekor: '+bestScore.toLocaleString('tr-TR');
  $('overInfo').textContent=`${run.meters.toLocaleString('tr-TR')} m · ${coins} altın (+${coins} ●)`;
  show('over');
}
$('overAgain').onclick=()=>startEndless();
$('overMenu').onclick=()=>toMenu();
function resetRun(){P=ZZ.newPlayer();P.got=[];P.ev=[];camX=P.x-viewW*.28;camY=0;parts.length=0;bolts.length=0;sq=1;acc=0;presses=0;held=ptrs.size>0;
  const a=$('attempt');a.textContent='Deneme '+attempts;a.style.display=attempts>1?'block':'none';}

// ---------- input ----------
function down(){ac();if(state!=='play')return;held=true;presses++;}
function up(){held=false;}
cv.addEventListener('pointerdown',e=>{ptrs.add(e.pointerId);down();e.preventDefault();});
addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)up();});
addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)up();});
addEventListener('blur',()=>{ptrs.clear();up();});
const JK=['Space','ArrowUp','KeyW'];
addEventListener('keydown',e=>{if(JK.includes(e.code)){e.preventDefault();if(!e.repeat)down();}});
addEventListener('keyup',e=>{if(JK.includes(e.code))up();});

// ---------- particles ----------
function burst(x,y,n,col,sp,life,sz,up){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.3+Math.random()*.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||0),life,max:life,c:typeof col==='function'?col():col,s:sz||4});}}

function handleEvents(){
  const ev=P.ev,s=skin();
  for(let i=0;i<ev.length;i++){
    const e=ev[i];
    if(e==='jump'){sq=1.35;sfx.jump();bolts.push({x:P.x+15,y:P.y+30,life:.22,max:.22});burst(P.x+15,P.y+30,8,'rgba(255,255,255,.8)',90,.35,4,30);}
    else if(e==='jump2'){sq=1.3;sfx.jump2();bolts.push({x:P.x+15,y:P.y+30,life:.26,max:.26,ring:true});burst(P.x+15,P.y+30,10,trailCol(s,time),120,.4,4,0);}
    else if(e==='land'){sq=.7;burst(P.x+15,P.y+30,6,'rgba(255,255,255,.7)',70,.3,3,20);}
    else if(e==='coin'){const c=L.coins[ev[++i]];sfx.coin();burst(c.cx,c.cy,12,'#ffd23f',160,.45,4,0);
      if(mode==='endless'){run.combo++;const m=Math.min(5,1+Math.floor(run.combo/8));if(m>run.mult)toast('Kombo ×'+m+' ⚡');run.mult=m;run.coinPts+=5*run.mult;}}
  }
  ev.length=0;
}
function onDeath(){state='dead';deadT=.7;bolts.push({x:P.x+15,y:P.y+15,life:.3,max:.3,ring:true,big:true});shake=12;sfx.die();buzz(90);burst(P.x+15,P.y+15,34,()=>Math.random()<.5?skinCol(skin(),time):trailCol(skin(),time),320,.8,5,80);}
function onWin(){state='winrun';winT=1.1;sfx.win();buzz([40,40,90]);
  const cols=['#ffd23f','#ff4d6d','#3ee0a8','#5ab4ff','#fff'];for(let i=0;i<70;i++)burst(L.end+Math.random()*40,L.endY-60-Math.random()*80,1,cols[i%5],260,1.4,5,140);}

function finishLevel(){
  state='win';
  const total=L.coins.length,got=P.coins,stars=ZZ.starsFor(got,total);
  wallet+=got+stars*5;bestStars[curN]=Math.max(bestStars[curN]||0,stars);
  if(stars>=2&&curN>=level)level=curN+1;
  save('zipzip_wallet',wallet);save('zipzip_stars',bestStars);save('zipzip_level',level);
  $('winStars').innerHTML=[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">★</span>`).join('');
  $('winCoins').textContent=`Altın: ${got} / ${total}  ·  +${got+stars*5} ●`;
  if(stars<3){const need=Math.ceil(total*(stars===1?ZZ.STAR2:ZZ.STAR3)-1e-9)-got;$('winHint').textContent=`Sonraki yıldız için ${need} altın daha topla.`;}
  else $('winHint').textContent='Mükemmel! Bütün yıldızlar senin.';
  if(stars>=2){$('winTitle').textContent='Seviye Tamam!';$('winNext').textContent='SONRAKİ ▶';countdown=0;}
  else{$('winTitle').textContent='Az kaldı! En az 2 yıldız lazım';countdown=3;$('winNext').textContent='TEKRAR (3)';}
  show('win');
}
$('winNext').onclick=()=>{countdown=0;startLevel($('winTitle').textContent.startsWith('Az')?curN:curN+1);};
$('winMenu').onclick=()=>{countdown=0;toMenu();};
$('hudMenu').onclick=()=>toMenu();

// ---------- update ----------
function update(dt){
  if(state==='play'||state==='winrun'){
    if(mode==='endless')L.extend(P.x+2500);
    acc+=dt;let k=0;
    while(acc>=ZZ.DT&&k<12){
      acc-=ZZ.DT;k++;
      let pr=false;if(state==='play'&&presses>0){presses--;pr=true;}
      ZZ.step(L,P,state==='play'&&(held||pr),pr);
      handleEvents();
      if(P.dead){onDeath();break;}
      if(P.won&&state==='play')onWin();
    }
    if(k>=12)acc=0;
  }else if(state==='dead'){deadT-=dt;if(deadT<=0){if(mode==='endless')showOver();else{attempts++;resetRun();state='play';}}}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on');}
  if(mode==='endless'&&P&&state==='play'){endlessScore();const sp=L.speedAt(P.x);if(run.spd&&sp>run.spd+1)toast('Hız arttı! ⚡');run.spd=sp;}
  if(state==='winrun'){winT-=dt;if(winT<=0)finishLevel();}
  if(state==='win'&&countdown>0){countdown-=dt;$('winNext').textContent=`TEKRAR (${Math.max(1,Math.ceil(countdown))})`;if(countdown<=0)startLevel(curN);}
  // visuals
  if(P&&!P.dead){
    const tgt=P.ground?1:1+Math.min(.25,Math.abs(P.vy)/2800);
    sq+=(tgt-sq)*Math.min(1,12*dt);
    if(P.ground&&(state==='play'||state==='winrun')&&Math.random()<.7)parts.push({x:P.x+4,y:P.y+28,vx:-40-Math.random()*40,vy:-20-Math.random()*30,life:.35,max:.35,c:trailCol(skin(),time),s:3+Math.random()*2});
    camX+=(P.x-viewW*.28-camX)*Math.min(1,10*dt);
    let ty=P.lastGround-ZZ.GROUND;
    if(P.y-ty<70)ty=P.y-70;if(P.y-ty>300)ty=P.y-300;
    camY+=(ty-camY)*Math.min(1,6*dt);
  }
  for(let i=bolts.length-1;i>=0;i--){bolts[i].life-=dt;if(bolts[i].life<=0)bolts.splice(i,1);}
  shake*=Math.pow(.88,dt*60);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}q.vy+=600*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
  if(P&&state!=='menu'){
    if(mode==='endless'){$('hudLv').textContent=`⚡ ${run.meters.toLocaleString('tr-TR')} m`;$('hudCoin').textContent=`Skor ${run.score.toLocaleString('tr-TR')}`+(run.mult>1?` ×${run.mult}`:'');}
    else{$('barf').style.width=Math.min(100,P.x/L.end*100)+'%';$('hudCoin').textContent=`● ${P.coins}/${L.coins.length}`;}
  }
}

// ---------- render ----------
function render(){
  const hue=L?(mode==='endless'&&P?(L.hue+P.x/150)%360:L.hue):250;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,cH);
  g.addColorStop(0,`hsl(${hue},55%,${18}%)`);g.addColorStop(1,`hsl(${(hue+40)%360},65%,52%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,cW,cH);
  if(!L){if($('menu').classList.contains('on'))menuBg();return;}
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  // hills
  hill(.25,ZZ.GROUND-70,40,`hsla(${(hue+20)%360},45%,30%,.55)`,sx,sy);
  hill(.5,ZZ.GROUND-25,30,`hsla(${(hue+10)%360},45%,22%,.75)`,sx,sy);
  const k=dpr*scale;
  ctx.setTransform(k,0,0,k,(-camX*scale+sx)*dpr,(offY-camY*scale+sy)*dpr);
  const x0=camX-60,x1=camX+viewW+60,c0=Math.max(0,(x0/256)|0),c1=(x1/256)|0;
  const seen=new Set();
  const topY=camY-offY/scale-50,botY=camY+H+50;
  for(let c=c0;c<=c1;c++){const arr=L.grid[c];if(!arr)continue;for(const o of arr){if(seen.has(o))continue;seen.add(o);drawObj(o,topY,botY);}}
  if(isFinite(L.end))drawFlag();
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);}
  ctx.globalAlpha=1;
  drawBolts();
  if(P&&!P.dead){ctx.save();ctx.translate(P.x+15,P.y+30);drawChar(ctx,skin(),time,P.vy,sq);ctx.restore();}
}
// Lightning: a jagged bolt from the takeoff point to the character's feet (jump trail),
// plus a ring of short sparks for the double jump and death. Redrawn with fresh jitter each frame.
function jag(x0,y0,x1,y1,seg,amp){const pts=[[x0,y0]];const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  for(let i=1;i<seg;i++){const f=i/seg,j=(Math.random()*2-1)*amp;pts.push([x0+dx*f+nx*j,y0+dy*f+ny*j]);}pts.push([x1,y1]);return pts;}
function strokeBolt(pts,a){for(const [w,c] of [[8,'rgba(80,190,255,.28)'],[3.5,'rgba(170,235,255,.9)'],[1.4,'#fff']]){
  ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();}}
function drawBolts(){
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  for(const b of bolts){
    const a=Math.min(1,b.life/b.max*1.5);
    const tx=P&&!P.dead?P.x+15:b.x,ty=P&&!P.dead?P.y+30:b.y;
    if(!b.ring||!b.big)strokeBolt(jag(b.x,b.y,tx,ty,6,7),a);
    if(b.ring){const cx=b.big?b.x:tx,cy=b.big?b.y:ty,R=(b.big?46:26)*(1.2-b.life/b.max*.5);
      for(let k=0;k<(b.big?9:6);k++){const an=k/(b.big?9:6)*Math.PI*2+b.max;strokeBolt(jag(cx+Math.cos(an)*8,cy+Math.sin(an)*8,cx+Math.cos(an)*R,cy+Math.sin(an)*R,3,4),a*.9);}}
  }
  ctx.restore();ctx.globalAlpha=1;
}
function hill(f,base,amp,col,sx,sy){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,cH);
  for(let x=0;x<=cW+8;x+=8){const wx=x/scale+camX*f;const wy=base-(Math.sin(wx*.006)*amp+Math.sin(wx*.017+1)*amp*.4);ctx.lineTo(x+sx,offY+(wy-camY*f)*scale+sy);}
  ctx.lineTo(cW,cH);ctx.closePath();ctx.fill();
}
function drawObj(o,topY,botY){
  const hue=L.hue;
  if(o.t===0){
    const y0=o.y,y1=Math.min(o.y+o.h,botY);if(y1<topY||y0>botY)return;
    ctx.fillStyle=`hsl(${hue},30%,13%)`;ctx.fillRect(o.x,y0,o.w,y1-y0);
    ctx.fillStyle=`hsl(${(hue+150)%360},75%,62%)`;ctx.fillRect(o.x,y0,o.w,5);
    ctx.fillStyle='rgba(255,255,255,.05)';for(let x=o.x+20;x<o.x+o.w-10;x+=40)ctx.fillRect(x,y0+14,10,Math.min(10,y1-y0-14));
  }else if(o.t===1){
    ctx.fillStyle='#ff3d5a';ctx.beginPath();ctx.moveTo(o.x+2,o.y);ctx.lineTo(o.x+15,o.y-28);ctx.lineTo(o.x+28,o.y);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(o.x+15,o.y-28);ctx.lineTo(o.x+19,o.y-6);ctx.lineTo(o.x+15,o.y-4);ctx.closePath();ctx.fill();
  }else if(o.t===2){
    const b=ZZ.pendPos(o,P?P.t:0);
    ctx.strokeStyle='rgba(230,230,240,.85)';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(o.ax,o.ay);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ddd';ctx.fillRect(o.ax-8,o.ay-5,16,8);
        ctx.fillStyle='#c9ced9';ctx.beginPath();
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=i%2?o.r:o.r+6;ctx.lineTo(b[0]+Math.cos(a)*r,b[1]+Math.sin(a)*r);}ctx.closePath();ctx.fill();
    ctx.fillStyle='#5b6175';ctx.beginPath();ctx.arc(b[0],b[1],o.r-3,0,7);ctx.fill();
    ctx.fillStyle='#ff3d5a';ctx.beginPath();ctx.arc(b[0],b[1],4,0,7);ctx.fill();
  }else if(o.t===3){
    if(P&&P.got&&P.got[o.i])return;
    const w=Math.abs(Math.cos(time*4+o.cx*.02))*9+2,y=o.cy+Math.sin(time*3+o.cx)*2;
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(o.cx,y,w,11,0,0,7);ctx.fill();
    if(w>4){ctx.save();ctx.translate(o.cx,y);ctx.scale(w/11,1);ctx.fillStyle='#b87a00';ctx.beginPath();ctx.moveTo(2.5,-8);ctx.lineTo(-4,1);ctx.lineTo(0,1);ctx.lineTo(-2.5,8);ctx.lineTo(4,-1);ctx.lineTo(0,-1);ctx.closePath();ctx.fill();ctx.restore();}
  }
}
function drawFlag(){
  const x=L.end,y=L.endY;
  for(let i=0;i<2;i++)for(let j=0;j<3;j++){ctx.fillStyle=(i+j)%2?'#111':'#fff';ctx.fillRect(x-8+i*8,y+j*5,8,5);}
  ctx.fillStyle='#fff';ctx.fillRect(x-2,y-110,4,110);
  const cs=9;
  for(let i=0;i<6;i++)for(let j=0;j<4;j++){const w=Math.sin(time*6-i*.8)*3*(i/5);ctx.fillStyle=(i+j)%2?'#111':'#fff';ctx.fillRect(x+2+i*cs,y-108+j*cs+w,cs+.5,cs+.5);}
}
function menuBg(){
  ctx.save();ctx.translate(cW/2,cH*.94);const s=Math.min(3,cW/160);ctx.scale(s,s);
  const hop=Math.abs(Math.sin(time*3))*18;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,0,16-hop*.3,4,0,0,7);ctx.fill();
  ctx.translate(0,-hop);drawChar(ctx,skin(),time,Math.cos(time*3)*-300,1+Math.cos(time*6)*.06);ctx.restore();
}

// ---------- menus ----------
function toMenu(){state='menu';mode='level';L=null;P=null;show('menu');
  const eb=$('endless');const open=level>5;eb.classList.toggle('lock',!open);eb.textContent=open?'⚡ SONSUZ KOŞU'+(bestScore?' · Rekor '+bestScore.toLocaleString('tr-TR'):''):'🔒 Sonsuz Koşu · 5. seviyeyi geç';
  $('status').textContent=`Seviye ${level} · ★ ${totalStars()} · ● ${wallet}`;}
$('play').onclick=()=>{ac();startLevel(level);};
$('endless').onclick=()=>{ac();if(level>5)startEndless();else{const b=$('endless');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('Önce 5. seviyeyi geç');}};
let resetArm=0;
$('reset').onclick=()=>{
  if(Date.now()-resetArm<3000){level=1;bestStars={};wallet=0;owned=['nane'];skinId='nane';
    bestScore=0;save('zipzip_best',0);save('zipzip_level',1);save('zipzip_stars',{});save('zipzip_wallet',0);save('zipzip_owned',owned);save('zipzip_skin',skinId);
    resetArm=0;$('reset').textContent='İlerlemeyi sıfırla';toMenu();return;}
  resetArm=Date.now();$('reset').textContent='Emin misin? Tekrar dokun';
  setTimeout(()=>{if(Date.now()-resetArm>=2900)$('reset').textContent='İlerlemeyi sıfırla';},3000);
};
$('toMap').onclick=()=>{buildMap();show('map');};
$('mapBack').onclick=toMenu;
function buildMap(){
  const g=$('mapGrid');g.innerHTML='';const N=Math.max(100,level+10);
  for(let i=1;i<=N;i++){const b=document.createElement('button');b.className='lv'+(i>level?' lock':'')+(i===level?' cur':'');
    const s=bestStars[i]||0;b.innerHTML=`${i}<small>${s?'★'.repeat(s)+'☆'.repeat(3-s):(i>level?'🔒':'')}</small>`;
    if(i<=level)b.onclick=()=>startLevel(i);g.appendChild(b);}
  setTimeout(()=>{const c=g.querySelector('.cur');c&&c.scrollIntoView({block:'center'});},0);
}
const shopCanvases=[];
$('toShop').onclick=()=>{buildShop();show('shop');};
$('shopBack').onclick=toMenu;
function buildShop(){
  const g=$('shopGrid');g.innerHTML='';shopCanvases.length=0;
  $('shopWallet').textContent=`Cüzdan: ● ${wallet}  ·  ★ ${totalStars()}`;
  SKINS.forEach((s,i)=>{
    const card=document.createElement('div');card.className='card'+(s.id===skinId?' sel':'');
    const c=document.createElement('canvas');c.width=160;c.height=160;card.appendChild(c);shopCanvases.push({c,s,i});
    const nm=document.createElement('div');nm.textContent=s.name;card.appendChild(nm);
    const b=document.createElement('button');
    if(s.id===skinId)b.textContent='Seçili';
    else if(isOwned(s))b.textContent='Seç';
    else b.textContent=s.needStars?`🔒 ★${s.needStars}`:`🔒 ${s.price} ●`;
    b.onclick=()=>{
      if(isOwned(s)){skinId=s.id;save('zipzip_skin',skinId);buildShop();return;}
      if(!s.needStars&&wallet>=s.price){wallet-=s.price;owned.push(s.id);skinId=s.id;save('zipzip_wallet',wallet);save('zipzip_owned',owned);save('zipzip_skin',skinId);sfx.coin();buildShop();return;}
      card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');sfx.die();
    };
    card.appendChild(b);g.appendChild(card);
  });
}
function drawShop(){
  for(const {c,s,i} of shopCanvases){const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,160,160);
    const ph=time*3+i*.7,hop=Math.max(0,Math.sin(ph))*26,lock=!isOwned(s);
    x.translate(80,128);x.scale(2.2,2.2);
    x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(0,0,15-hop*.15,3.5,0,0,7);x.fill();
    x.translate(0,-hop);if(lock)x.globalAlpha=.55;drawChar(x,s,time,-Math.cos(ph)*300,hop<2?.85:1.08);}
}

function frame(ts){const dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;time+=dt;update(dt);render();if(state==='menu'||$('shop').classList.contains('on'))drawShop();requestAnimationFrame(frame);}
toMenu();requestAnimationFrame(frame);
try{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.drawImage(img,0,0,180,180);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}};
  img.src=document.querySelector('link[rel=icon]').href;}catch(e){}
window.ZZdebug={get P(){return P;},get L(){return L;},get state(){return state;},get run(){return run;},get mode(){return mode;},startLevel,startEndless,drawChar,SKINS};
// Offline support when served over http(s) (PWA / Play Store package)
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
